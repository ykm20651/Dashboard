spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dashboard_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${TEST_DB_USER}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 실행할 때마다 테이블 새로 만들고 종료 후 삭제
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# src/test/resources/application-test.yml
jwt:
  secret: "this-is-a-long-test-secret-key-which-should-be-32-bytes-minimum"
  expiration-ms: 3600000

