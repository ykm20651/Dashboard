spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # ⚠️ 운영 환경에서는 update (데이터 보존)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        type.preferred_uuid_jdbc_type: CHAR

  servlet:
    multipart:
      max-file-size: 50MB         # 단일 파일 업로드 최대 크기
      max-request-size: 50MB      # 요청 전체 파일 크기 제한

  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 3600              # 정적 자원 캐시 1시간 유지

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}           # GitHub Secret / .env로 주입
  validity-ms: 3600000            # 1시간 (1000ms * 60 * 60)

# FastAPI 서버 설정
fastapi:
  base-url: ${FASTAPI_BASE_URL:http://localhost:8000}  # 로컬 개발용 기본값

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG      # SQL 쿼리 로그 표시
    org.hibernate.type: TRACE     # 파라미터 값까지 출력 (디버깅용)


