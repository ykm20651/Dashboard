<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보고서 관리 | OASIS</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/mypage.css">
  <link rel="stylesheet" href="css/report.css">

  <!-- JS -->
  <script defer src="js/auth.js"></script>
  <script defer src="js/main.js"></script>
  <script defer src="js/report.js"></script>
</head>

<body>
  <header class="topbar blackbar">
    <div class="brand">
      <a href="index.html">
        <img src="images/오아시스 로고.png" alt="OASIS 로고" class="logo" />
      </a>
    </div>
    <nav class="gnb">
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="product.html">Product</a></li>
        <li><a href="index.html#analysis">Service</a></li>
        <li><a href="bm.html">BM</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="auth" id="authSection"></div>
  </header>

  <main class="reports-container">
    <!-- 상단 헤더 -->
    <div class="reports-header">
      <h1>보고서 관리</h1>
      <p>사고 보고서를 생성하고 관리하세요</p>
      <div class="header-actions">
        <button class="btn-primary" id="generateNewReport">새 보고서 생성</button>
        <button class="btn-secondary" onclick="window.location.href='incidents.html'">사고 관리</button>
      </div>
    </div>

    <!-- 필터 -->
    <div class="filter-section">
      <div class="filter-bar">
        <select id="typeFilter" class="filter-select">
          <option value="">전체 유형</option>
          <option value="OIL_SPILL">유류 유출</option>
          <option value="COLLISION">충돌</option>
          <option value="FIRE">화재</option>
          <option value="CREW_INJURY">선원 인명피해</option>
        </select>
        <input type="text" id="searchInput" placeholder="보고서 제목 검색..." class="search-input">
        <button class="btn-secondary" id="refreshBtn">새로고침</button>
      </div>
    </div>

    <!-- 통계 -->
    <div class="reports-stats">
      <div class="stat-item">
        <div class="stat-number" id="totalReports">0</div>
        <div class="stat-label">총 보고서</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="completedReports">0</div>
        <div class="stat-label">완료된 보고서</div>
      </div>
      <div class="stat-item">
        <div class="stat-number" id="pendingReports">0</div>
        <div class="stat-label">진행중인 보고서</div>
      </div>
    </div>

    <!-- 보고서 목록 -->
    <div class="reports-list-section">
      <div id="reportsList" class="reports-list"></div>
    </div>

    <!-- ✅ 보고서 생성 모달 -->
    <div id="generateModal" class="modal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2>새 보고서 생성</h2>
          <button class="modal-close" onclick="closeGenerateModal()">&times;</button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <!-- ✅ 테이블로 변경됨 -->
            <div class="incident-table-wrapper">
              <table id="incidentTable" class="incident-table">
                <thead>
                  <tr>
                    <th>제목</th>
                    <th>유형</th>
                    <th>지역</th>
                    <th>날짜</th>
                  </tr>
                </thead>
                <tbody id="incidentTableBody">
                  <!-- JS에서 동적 추가 -->
                </tbody>
              </table>
            </div>
            <small>사고를 클릭하여 선택하고 ‘보고서 생성’을 누르세요</small>
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeGenerateModal()">취소</button>
          <button class="btn-primary" id="confirmGenerate">보고서 생성</button>
        </div>
      </div>
    </div>
  </main>

  <!-- ✅ 알림(Toast) 컨테이너 -->
  <div id="toastContainer" class="toast-container"></div>
</body>
</html>
