<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Contact | OASIS 안다미로</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/contact.css">
  <!-- ✅ EmailJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
</head>

<body>
  <!-- ===== 상단 고정 헤더 ===== -->
  <header class="topbar blackbar">
    <div class="brand">
      <a href="index.html">
        <img src="images/오아시스 로고.png" alt="OASIS 로고" class="logo">
      </a>
    </div>
    <nav class="gnb">
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="product.html">Product</a></li>
        <li><a href="index.html#analysis">Service</a></li>
        <li><a href="bm.html">BM</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="auth">
      <a href="login.html" class="btn-auth">로그인</a>
      <a href="signup.html" class="btn-auth">회원가입</a>
    </div>
  </header>

  <!-- ===== Contact 본문 ===== -->
  <main class="contact-page">
    <!-- 좌측 : 회사 정보 + 지도 -->
    <section class="contact-info">
      <h1>Contact</h1>
      <p><strong>영업지원부 :</strong> +82 010 7670 6558</p>
      <p><strong>경영지원부 :</strong> +82 010 4023 2347</p>
      <p>mingi4226@naver.com</p>
      <p>부산광역시 남구 신선로 365 (주식회사 오아시스)</p>

      <div class="map-area">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3263.5975138265203!2d129.09010472235806!3d35.116759869573535!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1z67aA6rK964yAIOyaqeuLuey6oO2NvOyKpA!5e0!3m2!1sko!2skr!4v1758394966606!5m2!1sko!2skr"
          width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>

    <!-- 우측 : 문의 폼 -->
    <section class="contact-form">
      <form id="contact-form">
        <label for="name">Name *</label>
        <input type="text" id="name" name="user_name" required>

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="user_email" required>

        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="10" required></textarea>

        <button type="submit" class="submit-btn" id="submitBtn">SUBMIT</button>
        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p>© 2025 <strong>OASIS 안다미로</strong>. All rights reserved.</p>
    <p class="footer-links">
      <span class="disabled-link">Privacy Policy</span> |
      <span class="disabled-link">Terms of Service</span> |
      <a href="mailto:mingi4226@naver.com">Contact Us</a>
    </p>
  </footer>

  <!-- ===== EmailJS 스크립트 ===== -->
  <script>
    (function() {
      // 🔹 여기에 EmailJS Public Key 붙여넣기
      emailjs.init("KEi8ybhlbzH7dPJbC");
    })();

    const form = document.getElementById("contact-form");
    const btn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("form-status");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      btn.disabled = true;
      const oldText = btn.textContent;
      btn.textContent = "SENDING...";
      statusEl.textContent = "메일 전송 중입니다...";

      // 🔹 여기에 EmailJS Service ID, Template ID 붙여넣기
      emailjs.sendForm("oasis", "template_s3o2c8r", form)
        .then(() => {
          statusEl.textContent = "🌊 문의가 접수되었습니다. OASIS 팀이 빠르게 답변드리겠습니다!";
          form.reset();
        })
        .catch((error) => {
          console.error("메일 전송 오류:", error);
          statusEl.textContent = "❌ 전송 실패. 잠시 후 다시 시도해주세요.";
        })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = oldText;
        });
    });
  </script>
</body>
</html>
