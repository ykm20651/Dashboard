<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Contact | OASIS 안다미로</title>
  <!-- 메인 헤더/공통 스타일 -->
  <link rel="stylesheet" href="/css/styles.css">
  <!-- Contact 전용 스타일 -->
  <link rel="stylesheet" href="/css/contact.css">

  
</head>

<body>
  <!-- ===== 상단 고정 헤더 ===== -->
  <header class="topbar blackbar">
    <div class="brand">
      <a href="index.html">
        <img src="images/오아시스 로고.png" alt="OASIS 로고" class="logo">
      </a>
    </div>
    <nav class="gnb">
      <ul>
        <li><a href="about.html">About</a></li>
        <li><a href="product.html">Product</a></li>
        <li><a href="index.html#analysis">Service</a></li>
        <li><a href="bm.html">BM</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="auth">
      <a href="login.html" class="btn-auth">로그인</a>
      <a href="signup.html" class="btn-auth">회원가입</a>
    </div>
  </header>

  <!-- ===== Contact 본문 ===== -->
  <main class="contact-page">
    <!-- 좌측 : 회사 정보 + 지도 -->
    <section class="contact-info">
      <h1>Contact</h1>
      <p><strong>영업지원부 :</strong> +82 (0)70 8693 1262</p>
      <p><strong>경영지원부 :</strong> +82 (0)70 4006 1531</p>
      <p>contact@andamiro.co</p>
      <p>부산광역시 남구 신선로 365 (주식회사 오아시스)</p>

      <div class="map-area">
        <!-- 아래 src를 원하는 구글 지도 퍼가기 주소로 교체하세요 -->
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d3263.5975138265203!2d129.09010472235806!3d35.116759869573535!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1z67aA6rK964yAIOyaqeuLuey6oO2NvOyKpA!5e0!3m2!1sko!2skr!4v1758394966606!5m2!1sko!2skr"
          width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>
    </section>

    <!-- 우측 : 문의 폼 -->
    <section class="contact-form">
      <form>
        <label for="name">Name *</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="10" required></textarea>

        <button type="submit" class="submit-btn">SUBMIT</button>
      </form>
    </section>
  </main>
</body>
</html>
