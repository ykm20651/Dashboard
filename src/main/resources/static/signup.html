<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입 | OASIS</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/signup.css">
  <script defer src="js/signup.js"></script>
</head>
<body>
  <!-- 로고 (배경 상단 중앙) -->
  <div class="logo-fixed">
    <a href="index.html" class="logo-link">
      <img src="images/오아시스 로고2.png" alt="OASIS Logo" class="logo">
    </a>
  </div>

  <main class="signup-container">
    <!-- 회원가입 박스 -->
    <section class="signup-box">
      <h1>회원가입</h1>
      <form id="signupForm" class="signup-form">
        <label for="email">이메일</label>
        <input type="email" id="email" required>

        <label for="password">비밀번호</label>
        <input type="password" id="password" required>

        <div class="row">
          <div class="col">
            <label for="name">이름</label>
            <input type="text" id="name" required>
          </div>
          <div class="col">
            <label for="role">역할</label>
            <select id="role" required>
              <option value="">선택</option>
              <option value="OWNER">선주</option>
              <option value="CREW">선원</option>
            </select>
          </div>
        </div>

        <!-- 추가 정보 영역 -->
        <div id="owner-extra" style="display:none;">
          <label for="companyName">회사명</label>
          <input type="text" id="companyName">
          <label for="shipRegId">선박 등록번호</label>
          <input type="text" id="shipRegId">
          <label for="contactNumber">연락처</label>
          <input type="text" id="contactNumber">
          <label for="businessNumber">사업자등록번호</label>
          <input type="text" id="businessNumber">
        </div>

        <div id="crew-extra" style="display:none;">
          <label for="assignedOwnerId">소속 선주 ID</label>
          <input type="text" id="assignedOwnerId">
          <label for="position">직책</label>
          <input type="text" id="position">
        </div>

        <button type="submit" class="signup-btn">가입하기</button>
      </form>
      <p id="msg"></p>
    </section>
  </main>
</body>
</html>
