<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사고 등록 | OASIS</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/incident_register.css">
  <script defer src="js/config.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/incident_register.js"></script>
</head>
<body>
  <main class="incident-container">
    <!-- 로고 -->
    <a href="index.html" class="logo-link">
      <img src="images/오아시스 로고.png" alt="OASIS Logo" class="logo">
    </a>

    <!-- 등록 박스 -->
    <section class="section-box">
      <h2>사고 등록</h2>
      <form id="incidentForm" class="incident-form">
        <div class="form-row">
          <label for="title">사고 제목</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-row">
          <label for="description">사고 설명</label>
          <input type="text" id="description" required>
        </div>

        <div class="form-row">
          <label for="incidentType">사고 유형</label>
          <input type="text" id="incidentType" required placeholder="예: collision, oil_spill">
        </div>

        <div class="form-row">
          <label for="location">사고 장소</label>
          <input type="text" id="location" required>
        </div>

        <div class="form-row">
          <label for="happenedAt">발생 시각</label>
          <input type="datetime-local" id="happenedAt" required>
        </div>

        <button type="submit" class="save-btn">저장</button>
      </form>
      <p id="msg"></p>
    </section>
  </main>
</body>
</html>
