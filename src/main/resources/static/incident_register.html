<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사고 등록 | OASIS</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/incident_register.css">
  <script defer src="js/incident_register.js"></script>
</head>
<body>
  <main class="incident-container">
    <!-- 로고 -->
    <a href="index.html" class="logo-link">
      <img src="images/오아시스 로고2.png" alt="OASIS Logo" class="logo">
    </a>

    <!-- 등록 박스 -->
    <section class="section-box">
      <h2>사고 등록</h2>
      <form id="incidentForm" class="incident-form">
        <div class="form-row">
          <label for="title">사고 제목</label>
          <input type="text" id="title" placeholder="예: 선박 충돌 사고" required>
          <small class="help-text">사고의 주요 내용을 간단히 요약해주세요</small>
        </div>

        <div class="form-row">
          <label for="description">사고 설명</label>
          <textarea id="description" placeholder="예: 오전 10시경 A선박과 B선박 간 발생한 충돌 사고. 인명피해는 없었으나 선박에 경미한 손상이 발생했습니다." required></textarea>
          <small class="help-text">사고의 상세한 내용을 자세히 작성해주세요</small>
        </div>

        <!-- ✅ 사고 유형: select로 변경 -->
        <div class="form-row">
          <label for="incidentType">사고 유형</label>
          <select id="incidentType" required>
            <option value="">사고 유형을 선택하세요</option>
            <option value="collision">충돌 (collision)</option>
            <option value="oil_spill">유류 유출 (oil_spill)</option>
            <option value="fire">화재 (fire)</option>
            <option value="crew_injury">선원 부상 (crew_injury)</option>
          </select>
          <small class="help-text">발생한 사고의 유형을 선택해주세요</small>
        </div>

        <div class="form-row">
          <label for="location">사고 장소</label>
          <input type="text" id="location" placeholder="예: 부산항 북항 3부두" required>
          <small class="help-text">사고가 발생한 구체적인 위치를 입력해주세요</small>
        </div>

        <div class="form-row">
          <label for="happenedAt">발생 시각</label>
          <input type="datetime-local" id="happenedAt" required>
          <small class="help-text">사고가 발생한 정확한 날짜와 시간을 입력해주세요 (현재 시각보다 이전이어야 함)</small>
        </div>

        <button type="submit" class="save-btn">저장</button>
      </form>
      <p id="msg"></p>
    </section>
  </main>
</body>
</html>
