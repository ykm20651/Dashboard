version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: oasis-mysql
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: oasis-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    working_dir: /app
    volumes:
      - "/home/ec2-user/Dashboard/.env:/app/.env:ro"
      - "/home/ec2-user/Dashboard/uploads:/app/uploads" #EC2의 /home/ec2-user/Dashboard/uploads 폴더를 컨테이너 내부 /app/uploads에 ‘창문으로 연결’시켜줘
    # EC2 호스트
    #/home/ec2-user/Dashboard/uploads/
    #├── evidence/
    #└── reports/

    # 컨테이너 내부 (마운트 후)
    #/app/uploads/   ←== 여기서 보면 사실 EC2 폴더를 보고 있는 것
    #├── evidence/
    #└── reports/
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul

    ports:
      - "80:8080"

volumes:
  db_data:
