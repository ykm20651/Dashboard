version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: oasis-mysql
    restart: always
    env_file:
      - .env            # ✅ MySQL에도 .env의 값을 환경변수로 주입
    environment:
      TZ: Asia/Seoul
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: oasis-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env            # ✅ 값 주입
    volumes:
      - ./.env:/.env:ro # ✅ 실제 파일을 컨테이너 루트(/)에 마운트 (Dotenv가 찾음)
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?serverTimezone=UTC&characterEncoding=UTF-8
      TZ: Asia/Seoul
    ports:
      - "80:8080"       # ✅ 외부 80 → 내부 8080

volumes:
  db_data:
