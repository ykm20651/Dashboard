name: OASIS Dev CI/CD

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev')

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Gradle 빌드 (로컬 환경에서 최신 JAR 생성)
      - name: Build Spring Boot project (clean build)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test
          echo "✅ Local Gradle build complete!"

      # 3️⃣ EC2에 프로젝트 및 빌드된 산출물 복사
      - name: Copy project files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/Dashboard"

      # 4️⃣ EC2에서 application.yml 생성
      - name: Create application.yml on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/Dashboard/src/main/resources
            echo "${{ secrets.APPLICATION_YML }}" > /home/ec2-user/Dashboard/src/main/resources/application.yml
            echo "✅ application.yml created!"

      # 5️⃣ EC2에서 .env 생성
      - name: Create .env file on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.ENV_FILE }}" > /home/ec2-user/Dashboard/.env
            echo "✅ .env file created!"

      # 6️⃣ Docker Compose 빌드 및 배포 (no-cache + BUILD_TIME)
      - name: Build and deploy with Docker Compose (no-cache + build arg)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "🔧 Starting no-cache rebuild on EC2..."

            # 0) Docker 데몬 기동
            sudo systemctl enable --now docker || true

            cd /home/ec2-user/Dashboard

            # 1) compose 실행기 감지
            if sudo docker compose version >/dev/null 2>&1; then
              CMD="sudo docker compose"
            else
              CMD="sudo docker-compose"
            fi

            # 2) 기존 컨테이너 중단
            $CMD down || true

            # 3) 캐시 전부 삭제
            echo "🧹 Cleaning old Docker cache..."
            sudo docker system prune -a -f || true

            # 4) no-cache 빌드
            BUILD_TIME=$(date +%s)
            echo "🚀 Building Docker image with BUILD_TIME=$BUILD_TIME"
            $CMD build --no-cache --build-arg BUILD_TIME=$BUILD_TIME

            # 5) 컨테이너 실행
            echo "🔁 Starting containers..."
            $CMD up -d

            echo "✅ Deployment complete! (BUILD_TIME=$BUILD_TIME)"
