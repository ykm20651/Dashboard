name: OASIS Dev CI/CD

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev')

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ EC2에 프로젝트 파일 복사
      - name: Copy project files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ec2-user/Dashboard"

      # 3️⃣ EC2에서 application.yml 생성
      - name: Create application.yml on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/Dashboard/src/main/resources
            echo "${{ secrets.APPLICATION_YML }}" > /home/ec2-user/Dashboard/src/main/resources/application.yml

      # 3.5️⃣ EC2에서 .env 파일 생성
      - name: Create .env file on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.ENV_FILE }}" > /home/ec2-user/Dashboard/.env
            echo ".env file created on EC2 ✅"

      # 4️⃣ Amazon Linux 환경에서 Docker Compose 빌드 & 실행
      - name: Build and deploy with Docker Compose (no-cache)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "🔧 Starting no-cache rebuild on EC2..."

            # 0) 도커 데몬 활성화
            sudo systemctl enable --now docker || true

            cd /home/ec2-user/Dashboard

            # 1) compose 실행기 감지
            if sudo docker compose version >/dev/null 2>&1; then
              CMD="sudo docker compose"
            else
              CMD="sudo docker-compose"
            fi

            # 2) 기존 컨테이너 정리
            $CMD down || true

            # 3) 🔥 캐시 완전 무시하고 새 빌드
            echo "🚀 Building Docker image from scratch (no cache)"
            $CMD build --no-cache

            # 4) 컨테이너 재실행
            echo "🔁 Starting containers..."
            $CMD up -d

            echo "✅ Deployment complete!"
